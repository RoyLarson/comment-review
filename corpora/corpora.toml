# The corpora comment-review is measured against.
#
# Every rate in the skill -- 9% precision on the abs() detector, 4 of 84 dangling
# paths real, 27 of 48 residual runs one line over cap, 2 of 28 authored
# docstrings false -- was measured on ONE codebase and written down as though it
# were a property of the detector. It may instead be a property of that project's
# house style. A single corpus cannot tell those apart.
#
# ! EVERY ENTRY IS PINNED. A moving corpus makes a regression indistinguishable
# from the corpus having changed underneath the measurement, which cost a full
# day's comparison when the reference repository advanced mid-run.
#
# `expect` is a PREDICTION, and the point of the set. A heavily reviewed project
# should yield fewer findings per block than a solo one. If that gradient does
# not appear, the tool is measuring noise rather than prose defects -- which is a
# result, and a publishable one.
#
#   kind    local  = a repo on this machine; materialised as a git worktree,
#                    nothing copied.
#           public = fetched by URL at a tag; shallow, optionally sparse.
#   expect  low | medium | high  findings per block.
#   style   the docstring convention the corpus should exercise in stage 1.3.

[[corpus]]
name = "redacted_corpus"
kind = "local"
source = "C:/Users/Roy/projects/redacted_corpus"
ref = "REDACTED_SHA_A"
style = "google"
expect = "high"
note = """
The reference corpus, and the one every rule was derived from -- so it is the
LEAST useful evidence that a rule generalises. Pinned at the commit carrying the
twelve planted hazards in `evals/discriminators.md`. Solo project, no doc-hygiene
guard in the tree at this commit, which the runs measured as the cause of a high
citation-rot rate.
"""

[[corpus]]
name = "redacted_corpus_b"
kind = "local"
source = "C:/Users/Roy/projects/redacted_corpus_b"
ref = "a4bc6ec"
style = "unknown"
expect = "high"
note = """
Second solo project by the same author, 16 tracked .py files. Small, but it is
the cheapest available test of whether a finding is about editing or about one
project: same author, same habits, different domain. A rule that fires here and
nowhere else is about the author; one that fires here and in django is about
prose.
"""

# -- Public corpora ------------------------------------------------------------
# Chosen for VARIETY OF PROSE CONVENTION, not popularity. Curation level is the
# independent variable; docstring style is the confound worth spanning.
#
# ! These exist to CALIBRATE A DETECTOR. Findings against them are measurements,
# not defect reports, and are not a queue of pull requests to send anybody.

[[corpus]]
name = "flask"
kind = "public"
source = "https://github.com/pallets/flask"
ref = "3.1.0"
style = "sphinx"
expect = "low"
note = "Small, mature, one house style, decades of review. A near-floor reading."

[[corpus]]
name = "fastapi"
kind = "public"
source = "https://github.com/fastapi/fastapi"
ref = "0.115.6"
style = "google"
expect = "low"
note = """
Modern, type-hint heavy, docstrings doing double duty as published API
reference -- so its prose is READ by users, not only by maintainers. The
strongest available contrast with a solo project's inward-facing comments.
"""

[[corpus]]
name = "numpy"
kind = "public"
source = "https://github.com/numpy/numpy"
ref = "v2.2.0"
sparse = ["numpy/lib", "numpy/linalg"]
style = "numpydoc"
expect = "low"
note = """
Decades old, terse, C-adjacent, and the origin of numpydoc -- a convention the
skill's stage 1.3 has never seen. Sparse: two subpackages are enough to measure a
rate and the whole tree is far more than a pass can afford.
"""

[[corpus]]
name = "django"
kind = "public"
source = "https://github.com/django/django"
ref = "5.1.4"
sparse = ["django/core", "django/db/models"]
style = "sphinx"
expect = "low"
note = """
The most heavily reviewed Python codebase available, with a written style guide
and a mandatory review culture. The low-water mark: if comment-review finds as
much here per block as in a solo project, the detector is noisy and the gradient
hypothesis is refuted.
"""

# -- The cell that was missing -------------------------------------------------
# Every other public corpus here is pre-assistant AND heavily reviewed, so
# "curated" and "human-written" are collinear and no measurement can separate
# them. The reference corpus is the opposite corner: solo and essentially
# entirely assistant-written. These two are the corner neither can reach --
# assistant-written code that a real review culture DID see.
#
# ! They need HISTORY, not just a tree. The within-repo split blames each comment
# block to the commit that introduced it and asks whether that commit carries an
# assistant trailer; a depth-1 clone makes that impossible. `depth = 0` is full.
#
# Found by searching popular repos for trailers rather than searching trailers
# for repos -- the latter sorts by recency and returns solo projects, which is
# the corner already occupied.

[[corpus]]
name = "meta-package-manager"
kind = "public"
source = "https://github.com/kdeldycke/meta-package-manager"
ref = "v7.6.1"
depth = 0
style = "unknown"
expect = "medium"
note = """
609 stars, 96 assistant-trailer commits, 44 MB -- small enough for a full pass
WITH full history, which is what makes it the primary specimen rather than the
impressive one. Both arms of the trailer split live in one repo, so author,
reviewer, style guide and domain are all held constant and the generator is the
only variable. This is the first measurement in the project with a real control.
"""

[[corpus]]
name = "sentry"
kind = "public"
source = "https://github.com/getsentry/sentry"
ref = "master"
depth = 0
sparse = ["src/sentry/api", "src/sentry/models"]
style = "unknown"
expect = "medium"
note = """
44.5k stars and 2451 assistant-trailer commits, against deep pre-assistant
history -- the largest available sample of both arms under one review culture.
! 895 MB, so it is sparse and depth-limited, and `ref` is a BRANCH rather than a
tag: the visible tags are stale and a branch pin is weaker than a commit. Record
the resolved SHA when a measurement is taken from it, or the result is not
reproducible. Fetched once at b8df2b57097d2c452a4ba22d56054ae8e51931ac.

!! depth MUST be 0. A depth-2000 fetch put 96% of blamed lines on the graft
commit -- which carried a trailer, so the entire pre-assistant codebase was
labelled assisted and the split reported 1213 assisted blocks against 28 human.
The numbers were clean, plausible and meaningless. generator_split.py now
refuses a shallow checkout rather than reporting one.
"""

[[corpus]]
name = "pymc"
kind = "public"
source = "https://github.com/pymc-devs/pymc"
ref = "v5.19.1"
sparse = ["pymc/distributions"]
style = "numpydoc"
expect = "medium"
note = """
Scientific code where a DERIVATION is the comment -- the `derivation` acquittal
and the recompute-before-acquitting rule have only ever been tested against one
project's hand-worked arithmetic. Mid-sized review culture.
"""

[[corpus]]
name = "cpython"
kind = "public"
source = "https://github.com/python/cpython"
ref = "v3.13.1"
sparse = ["Objects", "Python", "Include"]
style = "unknown"
expect = "low"
note = """
HAND-WRITTEN C, added 2026-08-21 to settle whether a keyword list can ever
recognise a C declaration. Roy: *"pull Python -- all C and known to be
hand-written in most of the important parts."*

! The first C measurement was numpy's `linalg`, which is f2c-GENERATED LAPACK --
every definition opened with an f2c typedef (`doublereal`, `integer`) and not
one with a C keyword. That is evidence, but of generated code. `Objects/` and
`Python/` are the interpreter core: written by hand, reviewed for decades, and
carrying their own documentation convention.

! Sparse on three directories. The whole checkout is far more than a pass can
afford, and these hold the C that matters.
"""

# -- The languages with no corpus at all ---------------------------------------
# Added 2026-08-22. Roy, on `rust-lang/rust`: *"I was thinking of other large
# corpora that we could get and that has got to be a decent one."*
#
# !! SEVENTEEN LANGUAGE ROWS SHIP AND TWO HAVE EVER BEEN MEASURED. Everything
# above is Python except `cpython`, which is C -- so `doc_line`, `doc_block` and
# `doc_is_structural` are asserted for fifteen languages against nothing but
# fixtures this repo wrote itself. A fixture proves the reader does what its
# author expected; a corpus is the only thing that can disagree.
#
# ! CHOSEN FOR CONVENTION, not popularity -- the same rule the public corpora
# above follow. Each entry brings a documentation practice the tool has never
# read: rustdoc, godoc, javadoc, XML doc, doxygen, KDoc, RDoc, TSDoc, Swift
# markup, LuaLS. That set is the actual independent variable here, and the
# language is how it is spelled.
#
# ! ALL ARE SPARSE AND SHALLOW. None is here for the trailer split, so none
# needs `depth = 0`; each names the subtree where that language's own convention
# is written most carefully -- usually a standard library, which is the code its
# community documents to its own published rule.

[[corpus]]
name = "rust"
kind = "public"
source = "https://github.com/rust-lang/rust"
ref = "1.89.0"
sparse = ["library/core/src", "library/std/src"]
style = "rustdoc"
expect = "low"
note = """
The rustdoc convention at its source: `///` on an item, `//!` on the module, and
a doctest inside the prose that CI actually runs. ! That last part is the reason
this corpus is worth more than its size -- a worked example in a Rust docstring
is executable, so `block-context`'s worked-example remit has, for once, a
population where the ground truth is machine-checked.

! `library/` and not `compiler/`: the standard library is documented to a
published rule and the compiler internals are not.
"""

[[corpus]]
name = "go"
kind = "public"
source = "https://github.com/golang/go"
ref = "go1.27.0"
sparse = ["src/net/http", "src/os"]
style = "godoc"
expect = "low"
note = """
The one convention this repo has already ENCODED and never tested: Go's package
comment IS the file's own documentation, which is why `package` is deliberately
absent from the go row's `declares` list -- listing it gave the same prose both
`a0` and `a1`. That rule was reasoned out, not measured.

! It also carries the raw-string shape fixed 2026-08-22: a backtick literal
holding a URL, which censused as a trailing comment until the row named the
backtick a quote.
"""

[[corpus]]
name = "typescript"
kind = "public"
source = "https://github.com/microsoft/TypeScript"
ref = "v7.0.2"
sparse = ["src/compiler"]
style = "tsdoc"
expect = "low"
note = """
TSDoc, and a compiler written in its own language -- so the prose describes type
machinery precisely, which is the hardest case for `function-context`'s absence
question. ! Template literals cross lines here, the shape the `ts` row declares
as a spanning quote.
"""

[[corpus]]
name = "elasticsearch"
kind = "public"
source = "https://github.com/elastic/elasticsearch"
ref = "v9.5.2"
sparse = ["server/src/main/java/org/elasticsearch/index"]
style = "javadoc"
expect = "low"
note = """
Javadoc -- the oldest structured docstring convention in wide use, and the one
whose `@param`/`@return` tags make a claim mechanically checkable against a
signature. ! Java's `record` is a SOFT keyword and the row cannot say so, which
is filed in `lexer-and-language-findings`; this is the corpus that would say how
often a real file trips it.
"""

[[corpus]]
name = "dotnet-runtime"
kind = "public"
source = "https://github.com/dotnet/runtime"
ref = "v10.0.11"
sparse = ["src/libraries/System.Private.CoreLib/src/System"]
style = "xmldoc"
expect = "low"
note = """
XML documentation comments -- prose inside MARKUP inside a comment, which no
other convention here does, and which `block-context` has never been asked to
read. ! Verbatim strings (`@"..."`) cross lines and were undeclared until
2026-08-22; this is where that fix meets real code.
"""

[[corpus]]
name = "llvm"
kind = "public"
source = "https://github.com/llvm/llvm-project"
ref = "llvmorg-22.1.8"
sparse = ["llvm/lib/IR"]
style = "doxygen"
expect = "low"
note = """
Doxygen, and the C++ counterpart to `cpython`'s hand-written C. ! It is the
corpus for the C/C++ `a`-series RULING -- Roy, 2026-08-20: *"leave it out
because it is ambiguous in every way"* -- since a C++ declaration opens with a
return type and no keyword list can name one. This is where the cost of that
absence becomes a number rather than an argument. ! Raw string literals
(`R"(...)"`) live here too.
"""

[[corpus]]
name = "rails"
kind = "public"
source = "https://github.com/rails/rails"
ref = "v8.1.3.1"
sparse = ["activerecord/lib/active_record"]
style = "rdoc"
expect = "low"
note = """
RDoc, and a house style where the comment above a method is documentation by
convention rather than by syntax -- the weakest structural signal of any corpus
here, which makes it the hardest test of `ownership-context`. ! Ruby heredocs
are the spanning shape the row still cannot declare cheaply, because the opener
is also the array-append operator.
"""

[[corpus]]
name = "neovim"
kind = "public"
source = "https://github.com/neovim/neovim"
ref = "v0.12.4"
sparse = ["runtime/lua"]
style = "luals"
expect = "medium"
note = """
The only Lua corpus available at this scale, and it exercises the long-bracket
comment whose LEVELS were missing until 2026-08-22. ! LuaLS annotations
(`---@param`) are a docstring convention layered on an ordinary line comment,
which is a shape the `doc_line` field cannot currently express for any language.
"""

[[corpus]]
name = "kotlin"
kind = "public"
source = "https://github.com/JetBrains/kotlin"
ref = "v2.4.10"
sparse = ["libraries/stdlib/src/kotlin"]
style = "kdoc"
expect = "low"
note = """
KDoc, and the corpus for the SOFT KEYWORD question: `data`, `sealed` and `open`
are ordinary identifiers, so `data class` is a two-word entry on the row -- right
because KOTLIN'S grammar says so, and evidence about no other language. ! Trying
that same shape on Java's `record` broke a real declaration, which is the
measurement that produced the per-language rule in CLAUDE.md.
"""

[[corpus]]
name = "swift"
kind = "public"
source = "https://github.com/apple/swift"
ref = "swift-6.3.3-RELEASE"
sparse = ["stdlib/public/core"]
style = "swift-markup"
expect = "low"
note = """
Swift markup: `///` carrying a Markdown dialect with named sections, so a
docstring here has STRUCTURE a reviewer can be wrong about in ways plain prose
cannot. ! `required` and `convenience` are the same soft-keyword class as
Kotlin's `data`, and are still unhandled -- filed in
`lexer-and-language-findings`.
"""
