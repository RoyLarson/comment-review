# Not a package -- this exists so the formatter cannot rewrite the plugin's
# script into syntax it must not require.
#
# ! target-version is DELIBERATELY OLD. Everything under `plugins/` ships to
# other people's repositories, and each script promises it runs there. Formatting from
# a checkout that targets 3.14 rewrote `except (A, B):` into PEP 758's
# unparenthesised form twice -- a SyntaxError on every older interpreter, in the
# files the skill hands to strangers. A `noqa` did not hold; a floor does.

# !! THE FLOOR IS THE DEVELOPMENT INTERPRETER, and that is the point. `uv`
# pins it in `.python-version`; run the gate through `.venv` or `uv run`.
# Measured 2026-08-17: with 3.14 on the dev machine, four of the eight shipped
# scripts raised `NameError` at IMPORT on 3.11 for two days' worth of commits,
# passing every test and the shipped-syntax gate, because PEP 649 makes
# annotations lazy from 3.14. Roy: "the floor will not fail if we are using the
# floor to evaluate the code."

[project]
name = "comment-review"
requires-python = ">=3.11"
# !! A SECOND COPY OF THE VERSION, and it is CHECKED. `CHANGELOG.md` says a
# version number lives only there, and it still should -- but `uv` requires
# either this or `dynamic`, and a dynamic version can only be learned by
# BUILDING, which `package = false` otherwise avoids entirely.
#
# So the copy is unavoidable and `tests/test_release.py` makes it safe: it must
# equal the newest `## [x.y.z]` heading in `CHANGELOG.md`. ! Two copies of a
# number with nothing comparing them is the defect this repo spends its days
# catching -- it shipped a stale verdict name and a stale stage diagram from
# exactly that shape on 2026-08-17. Two copies WITH a check is a release gate:
# it also catches cutting a release and forgetting to bump.
version = "0.2.4-alpha"

# ! NOT A PACKAGE, said where a tool reads it rather than only in a comment.
[tool.uv]
package = false

# !! THE GATES ARE PINNED, FOR THE REASON THE HEADER ABOVE PINS THE INTERPRETER.
# Roy, 2026-08-22: *"we can't have my personal computer's `ty` happens to work."*
# Until then this file spent sixteen lines arguing that an ambient interpreter
# silently passed broken code for two days -- and then invoked `ruff` off PATH,
# so the linter that enforces the floor was itself whatever the machine had.
#
# ! A LINTER IS NOT A NEUTRAL READER. `ruff format` REWRITES source, and its
# output changes between versions; the `target-version` above protects the
# syntax it emits and cannot protect against a different ruff emitting something
# else. An unpinned formatter is an unreviewed author.
#
# ! `ty` IS PRE-1.0 AND SAYS SO IN ITS VERSION NUMBER, which is an argument FOR
# pinning it rather than against having it: its diagnostics will change, and a
# gate that changes underneath a green run is the thing `docs/gates.md` is about.
#
# ! `uv run` INSTALLS THIS GROUP BY DEFAULT, so `uv run ruff` and `uv run ty`
# get these and not PATH. The commands in CLAUDE.md say `uv run` for that reason.
[dependency-groups]
dev = [
  "ruff==0.16.1",
  "ty==0.0.68",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# !! A CAPTURED RUN IS EVIDENCE, NOT SOURCE. `evidence/<name>-full-*/` holds
# what a run actually produced -- reports, censuses, and the scratch scripts the
# reviewers wrote to settle their own claims. Reformatting one edits the record
# of what happened, which is the same argument the format exclude below makes
# about specifications.
#
# Measured 2026-08-17: a `ruff format .` in one session's gate rewrote another
# session's in-flight run artifacts, and `ruff check .` then failed on a scratch
# script that was never repo code -- a red gate belonging to nobody.
#
# ! `evidence/ga/` is NOT excluded: it is tracked, maintained code that scores
# the corpora, and it is linted like anything else.
#
# !! VENDORED CODE IS SOMEBODY ELSE'S SOURCE. `scripts/todo_tool.py` is copied
# verbatim from `redacted_corpus` at `todo-requires-roy` REDACTED_SHA_D, and is
# re-grabbed rather than maintained here. Formatting it to THIS repo's config
# forks it, so the next grab arrives as a conflict in every file -- the same
# argument the evidence exclude makes, one repository over. ! A local patch to a
# vendored file says so at the patch.
extend-exclude = ["evidence/*-full-*", "scripts/todo_tool.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = [
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# ! Prose is not source. Ruff formats fenced Python inside Markdown, and
# `docs/` holds implementation plans whose code blocks ARE the specification an
# implementer transcribes. Reformatting them edits the spec after it was
# reviewed, and leaves the tree dirty behind the `ruff format .` in every
# task's gate -- which the next task then reads as its own uncommitted work.
exclude = ["**/*.md"]

[tool.ruff.lint.per-file-ignores]
# The corpora are other people's code, vendored at pinned refs. Linting them
# would report their style as our defects.
"corpora/**" = ["ALL"]
# Test names are the documentation here; a docstring per case restates the
# name and rots separately from it.
"tests/**" = ["D"]
